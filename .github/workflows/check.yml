# Format, lint, type-check, build and run the specs on every push and pull request.
# Same checks as tools/check.cmd and tools/check.sh.
name: Check

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: CompeyDev/setup-rokit@v0.2.1
        with:
          cache: true

      - name: Install packages
        if: hashFiles('wally.lock') != ''
        run: wally install

      - name: Sourcemap
        run: |
          rojo sourcemap default.project.json -o sourcemap.json
          for d in Packages ServerPackages; do
            if [ -d "$d" ]; then wally-package-types --sourcemap sourcemap.json "$d/"; fi
          done

      - name: Format
        run: stylua --check src tests

      - name: Lint
        run: selene src tests

      - name: Types
        run: |
          curl -fsSL -o globalTypes.d.luau https://luau-lsp.pages.dev/type-definitions/globalTypes.None.d.luau
          luau-lsp analyze --platform=roblox --definitions=@roblox=globalTypes.d.luau \
            --sourcemap=sourcemap.json \
            --ignore="Packages/**" --ignore="ServerPackages/**" --ignore="DevPackages/**" \
            --ignore="src/shared/assets.luau" src tests

      - name: Build
        run: rojo build -o check.rbxl

      - name: Specs
        run: lune run tools/lune/specs.luau
